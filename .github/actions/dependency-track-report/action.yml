name: Dependency-Track Report
description: Upload an SBOM to Dependency-Track, manage CycloneDX VEX, and generate and validate CSAF VEX

inputs:
  sbom-file:
    description: Path to the CycloneDX SBOM file
    required: true

  dependency-track-url:
    description: Dependency-Track base URL
    required: true

  api-key:
    description: Dependency-Track API key
    required: true

  project-name:
    description: Dependency-Track project name
    required: true

  project-version:
    description: Dependency-Track project version
    required: true

  project-type:
    description: CycloneDX component type for the project
    required: true

runs:
  using: composite
  steps:
    - name: Upload SBOM to Dependency-Track
      shell: bash
      env:
        DTRACK_URL: ${{ inputs.dependency-track-url }}
        DTRACK_API_KEY: ${{ inputs.api-key }}
        DTRACK_PROJECT_NAME: ${{ inputs.project-name }}
        DTRACK_PROJECT_VERSION: ${{ inputs.project-version }}
        SBOM_FILE: ${{ inputs.sbom-file }}
      run: |
        http_code=$(curl -sS \
          -o /tmp/dtrack-bom-response.json \
          -w "%{http_code}" \
          -X POST \
          -H "X-Api-Key: $DTRACK_API_KEY" \
          -F "autoCreate=true" \
          -F "projectName=$DTRACK_PROJECT_NAME" \
          -F "projectVersion=$DTRACK_PROJECT_VERSION" \
          -F "bom=@$SBOM_FILE" \
          "${DTRACK_URL%/}/api/v1/bom")

        if [ "$http_code" != "200" ]; then
          echo "Dependency-Track BOM upload failed with HTTP $http_code."
          exit 1
        fi

        processing_token=$(jq -r '.token // empty' /tmp/dtrack-bom-response.json)

        if [ -z "$processing_token" ]; then
          echo "Dependency-Track did not return a BOM processing token."
          exit 1
        fi

        echo "DTRACK_BOM_TOKEN=$processing_token" >> "$GITHUB_ENV"

    - name: Get Dependency-Track project UUID
      shell: bash
      env:
        DTRACK_URL: ${{ inputs.dependency-track-url }}
        DTRACK_API_KEY: ${{ inputs.api-key }}
        DTRACK_PROJECT_NAME: ${{ inputs.project-name }}
        DTRACK_PROJECT_VERSION: ${{ inputs.project-version }}
      run: |
        project_uuid=$(curl -sS \
          -H "X-Api-Key: $DTRACK_API_KEY" \
          --get \
          --data-urlencode "name=$DTRACK_PROJECT_NAME" \
          --data-urlencode "version=$DTRACK_PROJECT_VERSION" \
          "${DTRACK_URL%/}/api/v1/project/lookup" \
          | jq -r '.uuid // empty')

        if [ -z "$project_uuid" ]; then
          echo "Dependency-Track project could not be found."
          exit 1
        fi

        echo "DTRACK_PROJECT_UUID=$project_uuid" >> "$GITHUB_ENV"

    - name: Wait for Dependency-Track analysis
      shell: bash
      env:
        DTRACK_URL: ${{ inputs.dependency-track-url }}
        DTRACK_API_KEY: ${{ inputs.api-key }}
      run: |
        max_attempts=30
        attempt=1

        while [ "$attempt" -le "$max_attempts" ]; do
          processing=$(curl -sS \
            -H "X-Api-Key: $DTRACK_API_KEY" \
            "${DTRACK_URL%/}/api/v1/event/token/$DTRACK_BOM_TOKEN" \
            | jq -r '.processing // false')

          if [ "$processing" = "false" ]; then
            break
          fi

          sleep 10
          attempt=$((attempt + 1))
        done

        if [ "$processing" != "false" ]; then
          echo "Dependency-Track analysis did not complete within the expected time."
          exit 1
        fi

    - name: Download Dependency-Track findings
      shell: bash
      env:
        DTRACK_URL: ${{ inputs.dependency-track-url }}
        DTRACK_API_KEY: ${{ inputs.api-key }}
      run: |
        http_code=$(curl -sS \
          -o /tmp/dtrack-findings.json \
          -w "%{http_code}" \
          -H "X-Api-Key: $DTRACK_API_KEY" \
          "${DTRACK_URL%/}/api/v1/finding/project/$DTRACK_PROJECT_UUID")

        if [ "$http_code" != "200" ]; then
          echo "Failed to retrieve findings from Dependency-Track."
          exit 1
        fi

    - name: Generate CycloneDX VEX
      id: generate-vex
      shell: bash
      run: |
        python "$GITHUB_ACTION_PATH/generate-cyclonedx-vex.py" \
          --findings /tmp/dtrack-findings.json \
          --output /tmp/dtrack-vex.json \
          --project-uuid "$DTRACK_PROJECT_UUID" \
          --project-name "${{ inputs.project-name }}" \
          --project-version "${{ inputs.project-version }}" \
          --project-type "${{ inputs.project-type }}"

        if [ -f /tmp/dtrack-vex.json ]; then
          echo "has-vex=true" >> "$GITHUB_OUTPUT"
        else
          echo "has-vex=false" >> "$GITHUB_OUTPUT"
          echo "No findings require a new VEX analysis."
        fi

    - name: Upload CycloneDX VEX to Dependency-Track
      if: steps.generate-vex.outputs.has-vex == 'true'
      shell: bash
      env:
        DTRACK_URL: ${{ inputs.dependency-track-url }}
        DTRACK_API_KEY: ${{ inputs.api-key }}
      run: |
        http_code=$(curl -sS \
          -o /tmp/dtrack-vex-response.json \
          -w "%{http_code}" \
          -X POST \
          -H "X-Api-Key: $DTRACK_API_KEY" \
          -F "project=$DTRACK_PROJECT_UUID" \
          -F "vex=@/tmp/dtrack-vex.json" \
          "${DTRACK_URL%/}/api/v1/vex")

        if [ "$http_code" != "200" ]; then
          echo "Dependency-Track VEX upload failed with HTTP $http_code."
          exit 1
        fi
    
    - name: Generate CSAF VEX
      id: generate-csaf
      shell: bash
      env:
        DTRACK_URL: ${{ inputs.dependency-track-url }}
        DTRACK_API_KEY: ${{ inputs.api-key }}
        DTRACK_FINDINGS_FILE: /tmp/dtrack-findings.json
        SBOM_PATH: ${{ inputs.sbom-file }}
        CSAF_OUTPUT: /tmp/csaf-vex.json
        CSAF_PUBLISHER_NAME: mundialis
        CSAF_PUBLISHER_NAMESPACE: https://mundialis.de
      run: |
        finding_count=$(jq 'length' /tmp/dtrack-findings.json)

        if [ "$finding_count" -eq 0 ]; then
          echo "No findings were reported by Dependency-Track. CSAF VEX generation is not required."
          echo "has-csaf=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        python "$GITHUB_ACTION_PATH/generate_csaf.py"

        if [ -s /tmp/csaf-vex.json ]; then
          echo "has-csaf=true" >> "$GITHUB_OUTPUT"
          echo "CSAF VEX generated successfully."
        else
          echo "has-csaf=false" >> "$GITHUB_OUTPUT"
          echo "Dependency-Track reported findings, but none had an analysis state that could be included in the CSAF VEX."
        fi

    - name: Set up Node.js for CSAF validator
      if: steps.generate-csaf.outputs.has-csaf == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Install Hunspell for CSAF validator
      if: steps.generate-csaf.outputs.has-csaf == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y hunspell hunspell-en-us

        sudo ln -sf /usr/share/hunspell/en_US.aff /usr/share/hunspell/en.aff
        sudo ln -sf /usr/share/hunspell/en_US.dic /usr/share/hunspell/en.dic

    - name: Start CSAF validator
      if: steps.generate-csaf.outputs.has-csaf == 'true'
      shell: bash
      run: |
        npx --yes @secvisogram/csaf-validator-service \
          > /tmp/csaf-validator.log 2>&1 &

        echo $! > /tmp/csaf-validator.pid

        for attempt in {1..30}; do
          if curl -sf http://localhost:8082/docs > /dev/null 2>&1; then
            exit 0
          fi

          sleep 1
        done

        echo "CSAF validator did not start."
        cat /tmp/csaf-validator.log
        exit 1

    - name: Validate CSAF VEX
      if: steps.generate-csaf.outputs.has-csaf == 'true'
      shell: bash
      run: |
        http_code=$(jq -n \
          --slurpfile doc /tmp/csaf-vex.json \
          '{
            document: $doc[0],
            tests: [
              {
                name: "full",
                type: "preset"
              }
            ]
          }' \
        | curl -sS -X POST \
            "http://localhost:8082/api/v1/validate" \
            -H "Content-Type: application/json" \
            --data-binary @- \
            -o /tmp/csaf-validation-result.json \
            -w "%{http_code}")

        if [ "$http_code" != "200" ]; then
          echo "CSAF Validator service request failed with HTTP code $http_code."
          echo "Validator error:"
          jq -r '.message // .error // "Unknown validator error"' \
            /tmp/csaf-validation-result.json
          exit 1
        fi

        if [ "$(jq -r '.isValid' /tmp/csaf-validation-result.json)" != "true" ]; then
          echo "CSAF VEX validation failed."
          exit 1
        fi

        echo "CSAF VEX validation succeeded."